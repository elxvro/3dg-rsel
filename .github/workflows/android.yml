name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct mobile 3D models
        run: python tools/unpack_models.py

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Prepare Android debug signing
        shell: bash
        run: |
          mkdir -p "$HOME/.android" build
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -dname "CN=Android Debug,O=Android,C=US"               -keyalg RSA -keysize 2048 -validity 10000
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          godot --version

      - name: Import project
        run: godot --headless --path . --import

      - name: Export debug APK
        run: godot --headless --path . --export-debug "Android" build/ReaperProtocol-v0.1.0.apk

      - name: Verify APK
        run: |
          test -s build/ReaperProtocol-v0.1.0.apk
          ls -lh build/ReaperProtocol-v0.1.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReaperProtocol-v0.1.0-APK
          path: build/ReaperProtocol-v0.1.0.apk
          if-no-files-found: error
